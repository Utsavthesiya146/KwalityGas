services:
  - type: web
    name: kwality-gas-staging
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    autoDeploy: true
    # Optional persistent disk for zero-downtime offline enquiry buffering:
    # disk:
    #   name: kwality-storage
    #   mountPath: /var/data/storage
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SESSION_NAME
        value: kwality_admin_session
      - key: NEXT_PUBLIC_APP_URL
        value: https://kwalitygas-staging.onrender.com
      - key: NEXT_PUBLIC_COMPANY_NAME
        value: "Kwality Gas Bottlers Pvt Ltd"
      - key: NEXT_PUBLIC_COMPANY_CIN
        value: "U01120KA2005PTC036860"
      - key: NEXT_PUBLIC_COMPANY_PHONE
        value: "+91 80 2340 0459"
      - key: NEXT_PUBLIC_MARKETING_PHONE
        value: "+91 78997 87101"
      - key: NEXT_PUBLIC_OFFICE_EMAIL
        value: "kwalitygasmarketing@gmail.com"
      - key: PERSISTENT_STORAGE_DIR
        sync: false

